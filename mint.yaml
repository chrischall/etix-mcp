version: 1
name: Etix
slug: etix
# BROWSER-BRIDGE MCP: it reaches its site through the user's signed-in tab
# via the fetchproxy bridge, so a registration also needs runtime
# fly-shared, bridge: true and a bridgePortEnv — registration fields this
# manifest has no schema for. state.dataDir below is required for bridge and
# is why it is declared.
summary: >-
  Etix event discovery for Claude — search events, venues and performers, then
  fetch event details, dates and ticket prices through your signed-in Etix
  browser tab.
env:
  - name: ETIX_WS_PORT
    required: false
    help: >-
      Override the fetchproxy WebSocket port (default 37149).
  - name: ETIX_DEBUG
    required: false
    help: >-
      Set to 1 to log verbose request detail to stderr.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  # Only hosts the SERVER process actually fetches. Hosts that appear
  # solely in a URL this server BUILDS and returns are excluded.
  #
  # Empty on purpose: this is a pure browser-bridge MCP. Every Etix request
  # (www.etix.com) is made by the user's signed-in tab via the fetchproxy
  # extension, never by this process; the only socket the process opens is
  # the loopback WebSocket concentrator on 127.0.0.1:37149. There is no
  # direct mode. www.etix.com appears in src only as the base for URLs the
  # tools build and return.
  allow: []
examples:
  # Sample prompts for the public catalog. Every one is read-only and maps
  # onto the real tools: etix_search -> etix_get_venue / etix_get_event.
  - prompt: Search Etix for upcoming jazz shows and give me the event names with their ticket links.
    note: Uses etix_search; returns a few top matches, not an exhaustive list.
  - prompt: Look up the Lincoln Theatre on Etix and list its upcoming events with dates and start times.
    note: Finds the venue with etix_search, then lists its events via etix_get_venue.
  - prompt: What's the ticket price range for the next Marion Meadows show on Etix, and which venue is it at?
    note: Chains etix_search into etix_get_event for prices, offer levels and venue.
